<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Skyfall Arena — Full Prototype</title>
<style>
:root{--bg:#0b111b;--panel:#121c2b;--line:#304158;--accent:#4b7cff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,system-ui,Segoe UI,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none}.panel{background:#0d1624dd;border:1px solid #ffffff18;border-radius:14px;box-shadow:0 10px 35px #0004;backdrop-filter:blur(8px)}
#top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:10px}
#bars{padding:9px 12px;width:240px;font-size:12px}.bar{height:9px;background:#263448;border-radius:99px;overflow:hidden;margin:3px 0 6px}.fill{height:100%}.hp{background:#55d77e}.sh{background:#4f9dff}
#stats{padding:10px 12px;font-size:13px}.tag{display:inline-block;background:#24334a;border-radius:999px;padding:5px 8px;margin:2px}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;text-shadow:0 2px 8px #000}
#bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:end;gap:10px}
#weapon{padding:10px 14px;min-width:190px;text-align:center}#buttons{display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;max-width:70%}
button{border:0;color:#fff;background:#3d70ed;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.18);position:relative;z-index:20}button.alt{background:#27364a}button.warn{background:#c74f5c}
#toast{position:absolute;left:50%;top:90px;transform:translateX(-50%);padding:10px 15px;display:none}
#map{position:absolute;right:12px;top:92px;width:150px;height:150px;padding:0;overflow:hidden}.small{font-size:11px;color:#aebbd0}
#inventory{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,92vw);max-height:80vh;padding:18px;display:none;pointer-events:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.slot{padding:10px;background:#1a2738;border-radius:10px}.slot b{display:block}
#menu,#end{position:fixed;inset:0;background:#060b13ed;display:flex;align-items:center;justify-content:center;z-index:10}.modal{width:min(620px,92vw);padding:30px;border-radius:24px;background:#121d2c;border:1px solid #3a4b63;text-align:center}.modal h1{font-size:44px;margin:0 0 5px}.modal p{color:#b7c5d6;line-height:1.55}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.touch{display:none;position:absolute;right:12px;bottom:95px;gap:8px;pointer-events:auto}.touch button{width:58px;height:58px;border-radius:50%;padding:0}
@media(max-width:850px){#buttons button.build{display:none}.touch{display:flex}#map{width:105px;height:105px}.modal h1{font-size:34px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
 <div id="top">
  <div id="bars" class="panel">❤️ <b id="hpv">100</b><div class="bar"><div id="hp" class="fill hp"></div></div>🛡️ <b id="shv">50</b><div class="bar"><div id="sh" class="fill sh"></div></div></div>
  <div id="stats" class="panel"><span class="tag">👥 <b id="alive">25</b></span><span class="tag">🎯 <b id="kills">0</b></span><span class="tag">⭐ <b id="score">0</b></span><span class="tag">🌩️ <b id="storm">100%</b></span></div>
 </div>
 <div id="cross">+</div><div id="toast" class="panel"></div>
 <canvas id="map" class="panel"></canvas>
 <div id="bottom">
  <div id="buttons">
   <button onclick="fire()">FIRE</button><button class="alt" onclick="reload()">RELOAD</button>
   <button class="alt build" onclick="placeBuild('wall')">WALL</button><button class="alt build" onclick="placeBuild('ramp')">RAMP</button><button class="alt build" onclick="placeBuild('floor')">FLOOR</button>
   <button class="alt" onclick="toggleInventory()">INVENTORY</button>
  </div>
  <div id="weapon" class="panel">🔫 <b id="wname">Pulse Rifle</b><br><b id="ammo">30</b> / <span id="reserve">120</span></div>
 </div>
 <div class="touch"><button onclick="touchMove(0,-1)">▲</button><button onclick="fire()">🔥</button><button onclick="touchMove(0,1)">▼</button></div>
 <div id="inventory" class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Inventory</h2><button class="alt" onclick="toggleInventory()">Close</button></div><div id="invgrid" class="grid"></div></div>
</div>
<div id="menu"><div class="modal"><h1>SKYFALL ARENA</h1><p>Full original battle-royale prototype: loot, weapons, bots, building, vehicles, storm phases, quests and progression.</p><p><b>WASD</b> move · <b>mouse</b> aim · <b>click/space</b> fire · <b>R</b> reload · <b>1/2/3</b> build · <b>I</b> inventory</p><div class="row"><button id="dropBtn" type="button">DROP IN</button><button id="resetBtn" class="alt" type="button">RESET PROGRESS</button></div></div></div>
<div id="end" style="display:none"><div class="modal"><h1 id="endTitle"></h1><p id="endText"></p><div class="row"><button id="againBtn" type="button">PLAY AGAIN</button></div></div></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const menu = document.getElementById('menu');
  const end = document.getElementById('end');
  const drop = document.getElementById('dropBtn');
  const reset = document.getElementById('resetBtn');
  const again = document.getElementById('againBtn');

  const tap = (el, fn) => {
    if (!el) return;
    const handler = (e) => { e.preventDefault(); e.stopPropagation(); fn(); };
    el.addEventListener('click', handler, {passive:false});
    el.addEventListener('pointerup', handler, {passive:false});
    el.addEventListener('touchend', handler, {passive:false});
  };

  tap(drop, () => {
    if (typeof start === 'function') start();
  });
  tap(reset, () => {
    localStorage.removeItem('skyfallFull');
    location.reload();
  });
  tap(again, () => location.reload());

  // Tapping the title card itself also starts the game on mobile.
  const modal = document.querySelector('#menu .modal');
  if (modal) {
    modal.addEventListener('touchstart', e => {
      if (e.target.tagName !== 'BUTTON') e.stopPropagation();
    }, {passive:true});
  }

  // Prevent the browser's touch gestures from stealing game input.
  document.addEventListener('touchmove', e => {
    if (menu.style.display !== 'none') e.preventDefault();
  }, {passive:false});
});
</script>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),M=document.getElementById('map'),MX=M.getContext('2d');
let W,H,D,run=false,last=0,keys={},mouse={x:0,y:0,down:false},cam={x:1500,y:1500};
let save=JSON.parse(localStorage.getItem('skyfallFull')||'null')||{level:1,xp:0,wins:0,coins:0,inventory:{ammo:120,med:2,shield:2},skins:0};
let p={x:1500,y:1500,hp:100,shield:50,speed:255,ang:0,ammo:30,reserve:120,reload:0,kills:0,score:0,weapon:0};
let weapons=[
 {name:'Pulse Rifle',mag:30,damage:42,range:900,rate:.13,spread:.025},
 {name:'Scatter Blaster',mag:8,damage:18,range:480,rate:.55,spread:.20},
 {name:'Longshot',mag:5,damage:95,range:1300,rate:1.1,spread:.008}
];
let bots=[],loot=[],structures=[],particles=[],vehicles=[],storm={cx:1500,cy:1500,r:1450,t:0,phase:0};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.getContext('2d').setTransform(D,0,0,D,0,0);M.width=150*D;M.height=150*D;MX.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')fire();if(e.key.toLowerCase()==='r')reload();if(e.key==='1')placeBuild('wall');if(e.key==='2')placeBuild('ramp');if(e.key==='3')placeBuild('floor');if(e.key.toLowerCase()==='i')toggleInventory()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);C.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});C.addEventListener('mousedown',()=>mouse.down=1);addEventListener('mouseup',()=>mouse.down=0);
function saveIt(){localStorage.setItem('skyfallFull',JSON.stringify(save))}
function resetSave(){localStorage.removeItem('skyfallFull');location.reload()}
function start(){document.getElementById('menu').style.display='none';init();run=true;last=performance.now();requestAnimationFrame(loop)}
function init(){
 bots=[];loot=[];structures=[];vehicles=[];
 for(let i=0;i<24;i++)bots.push({x:rnd(120,2880),y:rnd(120,2880),hp:100,shield:rnd(0,45),speed:rnd(70,130),cd:rnd(0,2),dead:0,ang:0});
 const types=['ammo','ammo','med','shield','weapon','coins'];
 for(let i=0;i<90;i++)loot.push({x:rnd(70,2930),y:rnd(70,2930),type:types[Math.floor(Math.random()*types.length)],value:Math.random()});
 for(let i=0;i<30;i++)structures.push({x:rnd(80,2920),y:rnd(80,2920),type:'rock',hp:999});
 for(let i=0;i<4;i++)vehicles.push({x:rnd(300,2700),y:rnd(300,2700),used:0});
 p={x:1500,y:1500,hp:100,shield:50,speed:255,ang:0,ammo:30,reserve:120,reload:0,kills:0,score:0,weapon:0};
 storm={cx:1500,cy:1500,r:1450,t:0,phase:0};
 toast('Drop successful — loot and survive!')
}
function wm(){return{x:cam.x+(mouse.x-W/2),y:cam.y+(mouse.y-H/2)}}
function aTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.q);toast.q=setTimeout(()=>e.style.display='none',1400)}
function fire(){
 if(!run||p.reload>0)return;let w=weapons[p.weapon];if(p.ammo<=0){reload();return}
 p.ammo--;p.ang=aTo(p,wm());let hit=null,best=w.range;
 for(const b of bots)if(!b.dead){let d=dist(p,b),a=aTo(p,b),da=Math.atan2(Math.sin(a-p.ang),Math.cos(a-p.ang));if(d<best&&Math.abs(da)<w.spread){hit=b;best=d}}
 if(hit){let dmg=w.damage*(1+Math.random()*.25);hit.hp-=dmg;burst(hit.x,hit.y);if(hit.hp<=0){hit.dead=1;p.kills++;p.score+=100;save.xp+=15;save.coins+=2;toast('Eliminated +100');}}
 burst(p.x+Math.cos(p.ang)*35,p.y+Math.sin(p.ang)*35);ui()
}
function reload(){if(p.reload<=0&&p.ammo<weapons[p.weapon].mag&&p.reserve>0)p.reload=.9}
function switchWeapon(n){p.weapon=n;p.ammo=Math.min(p.ammo,weapons[n].mag);toast(weapons[n].name)}
function placeBuild(type){let a=p.ang||0;structures.push({x:p.x+Math.cos(a)*70,y:p.y+Math.sin(a)*70,type,hp:250});p.score+=10;toast(type.toUpperCase()+' placed')}
function touchMove(x,y){p.x=clamp(p.x+x*80,20,2980);p.y=clamp(p.y+y*80,20,2980)}
function pickup(){
 for(let i=loot.length-1;i>=0;i--)if(dist(p,loot[i])<45){let l=loot.splice(i,1)[0];
  if(l.type==='ammo'){p.reserve+=30;save.inventory.ammo+=30;toast('+30 ammo')}
  if(l.type==='med'){save.inventory.med++;toast('Med kit collected')}
  if(l.type==='shield'){save.inventory.shield++;toast('Shield cell collected')}
  if(l.type==='weapon'){switchWeapon(Math.floor(Math.random()*3));toast('Weapon found')}
  if(l.type==='coins'){save.coins+=5;toast('+5 coins')}
  saveIt()
 }
}
function botUpdate(dt){
 for(const b of bots)if(!b.dead){b.cd-=dt;let d=dist(p,b),a=aTo(b,p);b.ang=a;
  if(d>330){b.x+=Math.cos(a)*b.speed*dt;b.y+=Math.sin(a)*b.speed*dt}
  else if(b.cd<=0&&d<800){b.cd=rnd(.7,1.8);let dmg=rnd(5,11);if(p.shield){let s=Math.min(p.shield,dmg);p.shield-=s;dmg-=s}p.hp-=dmg;burst(p.x,p.y)}
  b.x=clamp(b.x,20,2980);b.y=clamp(b.y,20,2980)
 }
}
function stormUpdate(dt){storm.t+=dt;storm.r=Math.max(240,1450-storm.t*7.2);let d=Math.hypot(p.x-storm.cx,p.y-storm.cy);if(d>storm.r)p.hp-=dt*8}
function burst(x,y){for(let i=0;i<8;i++)particles.push({x,y,vx:rnd(-100,100),vy:rnd(-100,100),life:.35})}
function ui(){hpv.textContent=Math.max(0,Math.ceil(p.hp));shv.textContent=Math.max(0,Math.ceil(p.shield));hp.style.width=clamp(p.hp,0,100)+'%';sh.style.width=clamp(p.shield*2,0,100)+'%';alive.textContent=bots.filter(x=>!x.dead).length+1;kills.textContent=p.kills;score.textContent=p.score;ammo.textContent=p.ammo;reserve.textContent=p.reserve;wname.textContent=weapons[p.weapon].name;storm.textContent=Math.round(storm.r/14.5)+'%'}
function update(dt){
 let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*p.speed*dt;p.y+=dy/l*p.speed*dt}
 p.x=clamp(p.x,20,2980);p.y=clamp(p.y,20,2980);if(mouse.x||mouse.y)p.ang=aTo(p,wm());if(mouse.down)fire();
 if(p.reload>0){p.reload-=dt;if(p.reload<=0){let w=weapons[p.weapon],n=Math.min(w.mag-p.ammo,p.reserve);p.ammo+=n;p.reserve-=n}}
 botUpdate(dt);pickup();stormUpdate(dt);particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt});particles=particles.filter(q=>q.life>0);cam.x=p.x;cam.y=p.y;ui();
 if(p.hp<=0)finish(0);if(bots.every(x=>x.dead))finish(1)
}
function draw(){
 X.clearRect(0,0,W,H);X.fillStyle='#659c61';X.fillRect(0,0,W,H);let sx=x=>x-cam.x+W/2,sy=y=>y-cam.y+H/2;
 X.strokeStyle='#ffffff10';X.lineWidth=1;for(let x=-((cam.x-W/2)%100);x<W;x+=100){X.beginPath();X.moveTo(x,0);X.lineTo(x,H);X.stroke()}for(let y=-((cam.y-H/2)%100);y<H;y+=100){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
 for(const s of structures){let x=sx(s.x),y=sy(s.y);if(s.type==='rock'){X.fillStyle='#59665f';X.beginPath();X.arc(x,y,25,0,7);X.fill()}else{X.fillStyle=s.type==='wall'?'#b8754c':'#9d6545';X.save();X.translate(x,y);X.rotate(s.type==='ramp'?.35:0);X.fillRect(-30,-18,60,36);X.restore()}}
 for(const l of loot){let x=sx(l.x),y=sy(l.y);X.font='22px sans-serif';X.fillText({ammo:'📦',med:'➕',shield:'🛡️',weapon:'🔫',coins:'🪙'}[l.type],x-10,y+8)}
 for(const v of vehicles){let x=sx(v.x),y=sy(v.y);X.font='28px sans-serif';X.fillText('🚙',x-14,y+10)}
 for(const b of bots)if(!b.dead){let x=sx(b.x),y=sy(b.y);X.save();X.translate(x,y);X.rotate(b.ang);X.fillStyle='#d84e58';X.fillRect(-13,-13,26,26);X.fillStyle='#fff';X.fillRect(8,-3,20,6);X.restore()}
 X.save();X.translate(W/2,H/2);X.rotate(p.ang);X.fillStyle='#3d76ff';X.fillRect(-14,-14,28,28);X.fillStyle='#eef5ff';X.fillRect(8,-4,28,8);X.restore();
 X.save();X.translate(W/2-(storm.cx-cam.x),H/2-(storm.cy-cam.y));X.strokeStyle='#b75cff';X.lineWidth=7;X.beginPath();X.arc(0,0,storm.r,0,7);X.stroke();X.restore();
 for(const q of particles){X.globalAlpha=q.life*2;X.fillStyle='#fff';X.fillRect(sx(q.x),sy(q.y),4,4);X.globalAlpha=1}
 MX.clearRect(0,0,150,150);MX.fillStyle='#172437';MX.fillRect(0,0,150,150);MX.strokeStyle='#b75cff';MX.beginPath();MX.arc(75,75,storm.r/3000*150,0,7);MX.stroke();MX.fillStyle='#3d76ff';MX.fillRect(p.x/3000*150-3,p.y/3000*150-3,6,6);MX.fillStyle='#e85a60';for(const b of bots)if(!b.dead){MX.fillRect(b.x/3000*150-1,b.y/3000*150-1,3,3)}
}
function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function toggleInventory(){let e=document.getElementById('inventory');e.style.display=e.style.display==='block'?'none':'block';let arr=[['Coins',save.coins],['XP',save.xp],['Level',1+Math.floor(save.xp/100)],['Med kits',save.inventory.med],['Shield cells',save.inventory.shield],['Stored ammo',save.inventory.ammo],['Victories',save.wins]];document.getElementById('invgrid').innerHTML=arr.map(x=>`<div class="slot"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}
function finish(win){run=false;if(win){save.wins++;save.xp+=250;save.coins+=50}saveIt();document.getElementById('end').style.display='flex';document.getElementById('endTitle').textContent=win?'🏆 VICTORY!':'💀 ELIMINATED';document.getElementById('endText').textContent=`Kills ${p.kills} · Score ${p.score} · ${win?'Victory bonus +250 XP and +50 coins':'Better luck next drop.'}`}
</script>
</body>
</html>
